<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title description">
  <title id="title">Shaurya Malhotra engineering command center</title>
  <desc id="description">A dark cyan and emerald command interface presenting applied AI, embedded systems, and automotive intelligence.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#05080f"/>
      <stop offset="0.5" stop-color="#07131a"/>
      <stop offset="1" stop-color="#07110f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#42e8ff"/>
      <stop offset="1" stop-color="#35f2a6"/>
    </linearGradient>
    <radialGradient id="core">
      <stop stop-color="#dffff7"/>
      <stop offset="0.25" stop-color="#57f6cf"/>
      <stop offset="0.62" stop-color="#1ba9b2" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#07131a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#49dbe5" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="280" rx="22" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="278" rx="21" fill="none" stroke="#47e7de" stroke-opacity="0.35"/>
  <rect width="1200" height="280" rx="22" fill="url(#grid)"/>
  <path d="M30 72V30h42M1128 30h42v42M30 208v42h42M1128 250h42v-42" fill="none" stroke="url(#accent)" stroke-width="3"/>
  <g transform="translate(132 140)" filter="url(#glow)">
    <circle r="88" fill="none" stroke="#47e7de" stroke-opacity="0.18"/>
    <circle r="71" fill="none" stroke="#42e8ff" stroke-width="2" stroke-dasharray="8 9"/>
    <circle r="52" fill="none" stroke="#35f2a6" stroke-opacity="0.65" stroke-width="5" stroke-dasharray="42 11"/>
    <circle r="40" fill="url(#core)"/>
    <path d="M0-31 27-15 27 15 0 31-27 15-27-15Z" fill="#07131a" stroke="#b7fff0" stroke-width="2"/>
    <circle r="13" fill="#b7fff0"/>
  </g>
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="260" y="63" fill="#73f9e2" font-size="12" letter-spacing="5">ENGINEERING NODE // ONLINE</text>
    <text x="258" y="126" fill="#f2fbff" font-size="48" font-weight="700" letter-spacing="2">SHAURYA MALHOTRA</text>
    <text x="260" y="161" fill="#8aa8b5" font-size="18" letter-spacing="3">APPLIED AI · EMBEDDED SYSTEMS · AUTOMOTIVE INTELLIGENCE</text>
    <rect x="260" y="194" width="166" height="34" rx="17" fill="#42e8ff" fill-opacity="0.08" stroke="#42e8ff" stroke-opacity="0.45"/>
    <text x="281" y="216" fill="#75edff" font-size="12" font-weight="600" letter-spacing="2">BUILD // VERIFY</text>
    <rect x="440" y="194" width="174" height="34" rx="17" fill="#35f2a6" fill-opacity="0.08" stroke="#35f2a6" stroke-opacity="0.45"/>
    <text x="464" y="216" fill="#64f5bb" font-size="12" font-weight="600" letter-spacing="2">SHIP // ITERATE</text>
    <text x="940" y="58" fill="#6d8792" font-size="11" letter-spacing="2">MISSION STATUS</text>
    <text x="940" y="87" fill="#64f5bb" font-size="17" font-weight="700">SYSTEMS NOMINAL</text>
    <text x="940" y="130" fill="#6d8792" font-size="11" letter-spacing="2">PRIMARY VECTOR</text>
    <text x="940" y="158" fill="#75edff" font-size="16" font-weight="600">INTELLIGENCE → IMPACT</text>
    <text x="940" y="201" fill="#6d8792" font-size="11" letter-spacing="2">OPERATING MODE</text>
    <text x="940" y="229" fill="#f2fbff" font-size="16" font-weight="600">PROTOTYPE / PRODUCTION</text>
  </g>
  <path d="M660 208h228l22-22h232" fill="none" stroke="#35f2a6" stroke-opacity="0.28"/>
  <circle cx="904" cy="192" r="4" fill="#35f2a6"/>
</svg>
