<svg xmlns="http://www.w3.org/2000/svg" width="560" height="210" viewBox="0 0 560 210" role="img" aria-labelledby="title desc">
  <title id="title">Terra Sentinel</title>
  <desc id="desc">Humanitarian risk command center for disaster lifelines and public warnings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#050d0b"/><stop offset="1" stop-color="#07151a"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#4ff0a4"/><stop offset="1" stop-color="#42d8ff"/></linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#71f7bb" stroke-opacity=".04"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.flow{animation:flow 8s linear infinite}.radar{transform-origin:475px 88px;animation:radar 5s linear infinite}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-80}}@keyframes radar{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.flow,.radar,.pulse{animation:none}}</style>
  </defs>
  <rect width="560" height="210" rx="18" fill="url(#bg)"/><rect x="1" y="1" width="558" height="208" rx="17" fill="none" stroke="#4ff0a4" stroke-opacity=".34"/><rect width="560" height="210" rx="18" fill="url(#grid)"/>
  <path class="flow" d="M22 134H390l22-22h117" fill="none" stroke="url(#accent)" stroke-opacity=".34" stroke-dasharray="5 8"/>
  <g font-family="Segoe UI,Inter,Arial,sans-serif">
    <text x="24" y="28" fill="#79f4ba" font-size="9" font-weight="700" letter-spacing="2.4">04 // HUMANITARIAN OPS</text>
    <text x="24" y="64" fill="#f1fff9" font-size="27" font-weight="750" letter-spacing="1.1">TERRA SENTINEL</text>
    <text x="24" y="91" fill="#96b4ad" font-size="12.5">Decision support for disaster lifelines.</text>
    <text x="24" y="111" fill="#718f89" font-size="11.5">Risk · allocation · forecasting · public warnings</text>
    <g transform="translate(24 145)"><rect width="60" height="24" rx="12" fill="#4ff0a4" fill-opacity=".08" stroke="#4ff0a4" stroke-opacity=".35"/><text x="14" y="16" fill="#87f5bd" font-size="9" font-weight="700">REACT</text></g>
    <g transform="translate(92 145)"><rect width="48" height="24" rx="12" fill="#4ff0a4" fill-opacity=".08" stroke="#4ff0a4" stroke-opacity=".35"/><text x="14" y="16" fill="#87f5bd" font-size="9" font-weight="700">PWA</text></g>
    <g transform="translate(148 145)"><rect width="102" height="24" rx="12" fill="#42d8ff" fill-opacity=".08" stroke="#42d8ff" stroke-opacity=".35"/><text x="12" y="16" fill="#80e7ff" font-size="9" font-weight="700">RISK ANALYSIS</text></g>
    <text x="24" y="193" fill="#4d7067" font-size="9" letter-spacing="1.8">DISASTER LIFELINES // LIVE</text>
  </g>
  <g aria-hidden="true">
    <circle cx="475" cy="88" r="47" fill="#4ff0a4" fill-opacity=".025" stroke="#4ff0a4" stroke-opacity=".23"/><circle cx="475" cy="88" r="30" fill="none" stroke="#42d8ff" stroke-opacity=".4"/>
    <path class="radar" d="M475 88V44A44 44 0 0 1 512 67z" fill="#4ff0a4" fill-opacity=".18" stroke="#4ff0a4" stroke-opacity=".5"/>
    <path d="M475 63l20 8v17c0 15-10 24-20 29-10-5-20-14-20-29V71z" fill="#061310" stroke="url(#accent)" stroke-width="1.5"/>
    <circle class="pulse" cx="475" cy="88" r="6" fill="#a1ffcf" filter="url(#glow)"/>
  </g>
</svg>
