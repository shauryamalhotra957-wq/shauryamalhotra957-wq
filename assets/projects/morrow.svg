<svg xmlns="http://www.w3.org/2000/svg" width="560" height="210" viewBox="0 0 560 210" role="img" aria-labelledby="title desc">
  <title id="title">Morrow</title>
  <desc id="desc">Local-first crisis rehearsal laboratory with a transparent 72-hour cascade model.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#090812"/><stop offset="1" stop-color="#17100d"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#b48cff"/><stop offset="1" stop-color="#ffb454"/></linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#d5b2ff" stroke-opacity=".04"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.flow{animation:flow 9s linear infinite}.ring1{animation:pulse 3s ease-in-out infinite}.ring2{animation:pulse 3s 1s ease-in-out infinite}.ring3{animation:pulse 3s 2s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-80}}@keyframes pulse{0%,100%{opacity:.18}50%{opacity:.9}}@media(prefers-reduced-motion:reduce){.flow,.ring1,.ring2,.ring3{animation:none}}</style>
  </defs>
  <rect width="560" height="210" rx="18" fill="url(#bg)"/><rect x="1" y="1" width="558" height="208" rx="17" fill="none" stroke="#b48cff" stroke-opacity=".34"/><rect width="560" height="210" rx="18" fill="url(#grid)"/>
  <path class="flow" d="M22 134H390l22-22h117" fill="none" stroke="url(#accent)" stroke-opacity=".34" stroke-dasharray="5 8"/>
  <g font-family="Segoe UI,Inter,Arial,sans-serif">
    <text x="24" y="28" fill="#c9a9ff" font-size="9" font-weight="700" letter-spacing="2.4">02 // DECISION INTELLIGENCE</text>
    <text x="24" y="64" fill="#fff7f0" font-size="27" font-weight="750" letter-spacing="1.5">MORROW</text>
    <text x="24" y="91" fill="#b2a5b9" font-size="12.5">A crisis rehearsal lab—not a black box.</text>
    <text x="24" y="111" fill="#8d8194" font-size="11.5">72-hour cascade · sensitivity · portfolio search</text>
    <g transform="translate(24 145)"><rect width="60" height="24" rx="12" fill="#b48cff" fill-opacity=".08" stroke="#b48cff" stroke-opacity=".35"/><text x="14" y="16" fill="#d2b9ff" font-size="9" font-weight="700">REACT</text></g>
    <g transform="translate(92 145)"><rect width="70" height="24" rx="12" fill="#b48cff" fill-opacity=".08" stroke="#b48cff" stroke-opacity=".35"/><text x="12" y="16" fill="#d2b9ff" font-size="9" font-weight="700">FASTIFY</text></g>
    <g transform="translate(170 145)"><rect width="88" height="24" rx="12" fill="#ffb454" fill-opacity=".08" stroke="#ffb454" stroke-opacity=".35"/><text x="12" y="16" fill="#ffc477" font-size="9" font-weight="700">SIMULATION</text></g>
    <text x="24" y="193" fill="#66586c" font-size="9" letter-spacing="1.8">CRISIS REHEARSAL // LOCAL-FIRST</text>
  </g>
  <g aria-hidden="true" transform="translate(475 88)">
    <circle class="ring3" r="49" fill="#b48cff" fill-opacity=".02" stroke="#b48cff" stroke-opacity=".3"/><circle class="ring2" r="35" fill="none" stroke="#d79bde" stroke-opacity=".55"/><circle class="ring1" r="20" fill="#ffb454" fill-opacity=".1" stroke="#ffb454"/>
    <path d="M-32 15L-10-4 5 8 31-22" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round"/><circle cx="31" cy="-22" r="5" fill="#ffd29a" filter="url(#glow)"/>
  </g>
</svg>
