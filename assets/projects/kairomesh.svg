<svg xmlns="http://www.w3.org/2000/svg" width="560" height="210" viewBox="0 0 560 210" role="img" aria-labelledby="title desc">
  <title id="title">KairoMesh</title>
  <desc id="desc">Resilient GPU outcome cloud with checkpoint recovery and verifiable receipts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#050910"/><stop offset="1" stop-color="#071a18"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#46e8ff"/><stop offset="1" stop-color="#36f2a6"/></linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#68f7ee" stroke-opacity=".045"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .flow{animation:flow 8s linear infinite}.pulse{animation:pulse 2.6s ease-in-out infinite}.orbit{transform-origin:475px 88px;animation:orbit 16s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-80}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes orbit{to{transform:rotate(360deg)}}
      @media(prefers-reduced-motion:reduce){.flow,.pulse,.orbit{animation:none}}
    </style>
  </defs>
  <rect width="560" height="210" rx="18" fill="url(#bg)"/><rect x="1" y="1" width="558" height="208" rx="17" fill="none" stroke="#46e8ff" stroke-opacity=".34"/><rect width="560" height="210" rx="18" fill="url(#grid)"/>
  <path class="flow" d="M22 134H390l22-22h117" fill="none" stroke="url(#accent)" stroke-opacity=".34" stroke-dasharray="5 8"/>
  <g font-family="Segoe UI,Inter,Arial,sans-serif">
    <text x="24" y="28" fill="#68e9f5" font-size="9" font-weight="700" letter-spacing="2.4">01 // RESILIENT COMPUTE</text>
    <text x="24" y="64" fill="#f2fbff" font-size="27" font-weight="750" letter-spacing="1.5">KAIROMESH</text>
    <text x="24" y="91" fill="#91aeb8" font-size="12.5">GPU jobs that finish—even when hosts don't.</text>
    <text x="24" y="111" fill="#718d97" font-size="11.5">Checkpoint recovery · fencing · verifiable receipts</text>
    <g transform="translate(24 145)"><rect width="66" height="24" rx="12" fill="#46e8ff" fill-opacity=".08" stroke="#46e8ff" stroke-opacity=".35"/><text x="13" y="16" fill="#85effa" font-size="9" font-weight="700">NEXT.JS</text></g>
    <g transform="translate(98 145)"><rect width="88" height="24" rx="12" fill="#46e8ff" fill-opacity=".08" stroke="#46e8ff" stroke-opacity=".35"/><text x="12" y="16" fill="#85effa" font-size="9" font-weight="700">TYPESCRIPT</text></g>
    <g transform="translate(194 145)"><rect width="112" height="24" rx="12" fill="#36f2a6" fill-opacity=".08" stroke="#36f2a6" stroke-opacity=".35"/><text x="13" y="16" fill="#6ff4bd" font-size="9" font-weight="700">FAULT TOLERANCE</text></g>
    <text x="24" y="193" fill="#4f7178" font-size="9" letter-spacing="1.8">OUTCOME CLOUD // OPEN SOURCE</text>
  </g>
  <g aria-hidden="true">
    <circle cx="475" cy="88" r="49" fill="#46e8ff" fill-opacity=".025" stroke="#46e8ff" stroke-opacity=".15"/>
    <g class="orbit"><circle cx="475" cy="88" r="36" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="8 8"/><circle cx="475" cy="52" r="4" fill="#d7fff7" filter="url(#glow)"/></g>
    <path d="M452 101V75l23-13 23 13v26l-23 13z" fill="#071510" stroke="#62f0cd" stroke-width="1.5"/>
    <circle class="pulse" cx="475" cy="88" r="8" fill="#78ffe1" filter="url(#glow)"/><circle cx="456" cy="76" r="3" fill="#46e8ff"/><circle cx="494" cy="100" r="3" fill="#36f2a6"/>
  </g>
</svg>
